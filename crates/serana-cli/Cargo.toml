[package]
name = "serana-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "serana"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
dotenvy = "0.15.7"
serana-adapters = { version = "0.1.0", path = "../serana-adapters" }
serana-domain = { version = "0.1.0", path = "../serana-domain" }
serana-services = { version = "0.1.0", path = "../serana-services" }
reedline = "0.51.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serana-app = { version = "0.1.0", path = "../serana-app" }

[dev-dependencies]
serana-testkit = { path = "../serana-testkit" }
rstest = "0.27.0"
wiremock = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process"] }
serde_json = "1.0.151"
