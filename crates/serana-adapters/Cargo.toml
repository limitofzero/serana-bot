[package]
name = "serana-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
backon = "1.6.0"
serana-domain = { version = "0.1.0", path = "../serana-domain" }
jiff = "0.2.37"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "time", "sync"] }
tracing = "0.1.44"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
rand = "0.10.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.5"
wiremock = "0.6.5"
