[package]
name = "serana-tg"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "serana_tg"
path = "src/lib.rs"

[[bin]]
name = "serana-tg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dotenvy = "0.15.7"
jiff = "0.2.37"
serana-adapters = { version = "0.1.0", path = "../serana-adapters" }
serana-domain = { version = "0.1.0", path = "../serana-domain" }
serana-services = { version = "0.1.0", path = "../serana-services" }
serana-app = { version = "0.1.0", path = "../serana-app" }
# teloxide defaults to native-tls, which drags openssl-sys — and therefore pkg-config
# and libssl-dev — into the build image. rustls with the system trust store keeps the
# runtime stage at ca-certificates alone.
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls-native-roots"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
jiff = "0.2.37"
serana-testkit = { path = "../serana-testkit" }
serde_json = "1.0.151"
tempfile = "3.27.0"
wiremock = "0.6.5"
